<style>
/* Layout: two levels. Above, a round dark room: each person's newspaper record hangs on one section of the wall,
   their name floating in a space left free among the clippings (left/right turns to the next person).
   Below, the biography: the text on the left, the clipping for the passage being read in the margin. */
:root {
  --bg: #070707;
  --ink: #ecebe6;
  --soft: #b4b3ad;
  --muted: #77766f;
  --faint: #34342f;
  --rule: #1b1b19;
  --paper: #1c1c1a;
  --paper-hi: #2d2d2a;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --caps: "Spectral SC", "Spectral", Georgia, serif;
  color-scheme: dark;
}
@view-transition { navigation: auto; }            /* the browser crossfades between the levels */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--serif); font-weight: 300; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--soft); outline-offset: 4px; }
.label { font-family: var(--caps); font-size: 14px; letter-spacing: .12em; color: var(--muted); font-weight: 400; }

/* ---------- levels ---------- */
.room { position: fixed; inset: 0; transition: opacity .7s ease, transform .9s cubic-bezier(.2, .7, .2, 1); }
body.level-bio .room { opacity: 0; transform: translateY(-7%); pointer-events: none; }
.bio { position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: var(--bg); outline: none;
  opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .6s ease, visibility 0s linear .6s; }
body.level-bio .bio { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .8s ease .15s, visibility 0s; }

/* ---------- the room ---------- */
.space { position: fixed; inset: 0; overflow: hidden; perspective: var(--persp, 1400px); touch-action: none; user-select: none;
  background: radial-gradient(ellipse 70% 60% at 50% 48%, #111110 0%, var(--bg) 72%); }
.space.dragging { cursor: grabbing; }
.world, .cluster { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.world { left: 50%; top: 50%; will-change: transform; }
.clip { position: absolute; display: block; backface-visibility: hidden; background: #0e0e0d;
  transform: rotateY(var(--a)) rotateX(var(--b)) translateZ(calc(var(--z) + var(--lift, 0px)));
  transition: transform .6s cubic-bezier(.2, .7, .2, 1), background-color .4s ease; }
.clip img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none;
  opacity: .62; transition: opacity .5s ease; }
.clip::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(236, 235, 230, .06); pointer-events: none; }
.clip:hover, .clip:focus-visible { --lift: 70px; }
.clip:hover img, .clip:focus-visible img { opacity: 1; }
.clip:focus-visible { outline-offset: 6px; }
.clip.mock, .ph, .mthumb { background-color: var(--paper); }
.clip.mock::before, .ph::before { content: ""; position: absolute; inset: 10% 8%; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(236, 235, 230, .09) 0 1.5px, transparent 1.5px 6px); }
.clip.mock:hover, .clip.mock:focus-visible { background-color: var(--paper-hi); }
.name3d { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; transform-style: preserve-3d; }
.name3d .inner { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: .4em;
  white-space: nowrap; text-align: center; color: var(--ink); opacity: .3; transition: opacity .8s ease; backface-visibility: hidden;
  text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 0 14px rgba(0, 0, 0, .85), 0 0 40px rgba(0, 0, 0, .9); }
.name3d .nm { font-size: var(--fs); font-weight: 300; line-height: 1; letter-spacing: .01em; }
.name3d .yr { font-family: var(--caps); font-size: calc(var(--fs) * .3); letter-spacing: .18em; color: var(--ink); font-variant-numeric: oldstyle-nums; }
.name3d.current .inner { opacity: .86; }
.name3d.current.lit .inner { opacity: 1; }
.edges { position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: linear-gradient(var(--bg) 0, rgba(7, 7, 7, 0) 120px, rgba(7, 7, 7, 0) calc(100% - 190px), var(--bg) 100%); }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 72% 68% at 50% 50%, transparent 42%, rgba(7, 7, 7, .94) 100%); }
.bar { position: fixed; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: baseline; gap: 8px 24px; flex-wrap: wrap;
  padding: 22px clamp(16px, 4vw, 56px); font-family: var(--caps); font-size: 14px; letter-spacing: .14em; color: var(--muted); pointer-events: none; }
.bar.top { top: 0; } .bar.bottom { bottom: 0; }
.bar .title { color: var(--soft); }
.caption { position: fixed; left: 50%; bottom: 66px; z-index: 5; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  font-family: var(--caps); font-size: 14.5px; letter-spacing: .12em; color: var(--ink); opacity: 0; transition: opacity .35s ease;
  text-shadow: 0 0 3px #000, 0 0 14px #000, 0 0 28px #000; }
.caption.on { opacity: 1; }
.ticks { position: fixed; left: 50%; bottom: 100px; z-index: 6; transform: translateX(-50%); display: flex; gap: 6px; }
.ticks[hidden] { display: none; }
.ticks button { width: 30px; height: 18px; display: grid; align-items: center; }
.ticks button::before { content: ""; height: 1px; background: var(--faint); transition: background .4s ease, height .4s ease; }
.ticks button:hover::before { background: var(--muted); }
.ticks button[aria-current="true"]::before { height: 2px; background: var(--ink); }
.down { position: fixed; left: 50%; bottom: 128px; z-index: 6; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px;
  font-family: var(--caps); font-size: 14px; letter-spacing: .14em; color: var(--soft); }
.down::after { content: ""; width: 8px; height: 8px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg); }
.down:hover { color: var(--ink); }
.space.focusing .clip, .space.focusing .clip:hover { --lift: 0px; }
.space.focusing .clip img { opacity: .16; }
.space.focusing .clip.mock { opacity: .3; }
.space.focusing .clip.focus img, .space.focusing .clip.focus.mock { opacity: 1; }
.space.focusing .clip.focus { cursor: grab; }
.space.focusing .name3d .inner, .space.focusing .name3d.current.lit .inner { opacity: .08; }
.up-cue { position: fixed; left: 50%; top: 18px; z-index: 6; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px;
  font-family: var(--caps); font-size: 14px; letter-spacing: .14em; color: var(--soft); }
.up-cue::before { content: ""; width: 8px; height: 8px; border-left: 1px solid currentColor; border-top: 1px solid currentColor; transform: rotate(45deg); margin-top: 4px; }
.up-cue:hover { color: var(--ink); }
body.leaving .room { opacity: 0; transform: translateY(6%); transition: opacity .45s ease, transform .6s ease; }

/* ---------- the biography ---------- */
.bio-bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: baseline; gap: 8px 24px; flex-wrap: wrap;
  padding: 20px clamp(16px, 4vw, 56px) 26px; background: linear-gradient(var(--bg) 68%, rgba(7, 7, 7, 0));
  font-family: var(--caps); font-size: 14px; letter-spacing: .14em; color: var(--muted); }
.bio-bar button, .bio-foot button { color: var(--soft); }
.bio-bar button:hover, .bio-foot button:hover { color: var(--ink); }
.bio-bar .people { display: flex; gap: 8px 24px; flex-wrap: wrap; }
.bio-inner { max-width: 1500px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px) 110px;
  display: grid; grid-template-columns: minmax(0, 40rem) minmax(min(42vw, 560px), 1fr); column-gap: clamp(32px, 4.5vw, 80px); }
.bio-head { grid-column: 1 / -1; display: grid; gap: 18px; padding: 26px 0 38px; border-bottom: 1px solid var(--rule); }
.bio-head h1 { font-size: clamp(46px, 5.6vw, 80px); font-weight: 300; line-height: 1; letter-spacing: -.005em; }
.full { font-family: var(--caps); font-size: 14px; letter-spacing: .1em; color: var(--muted); margin-top: 12px; }
.life { display: grid; grid-template-columns: max-content 1fr; gap: 4px 20px; font-size: 16.5px; color: var(--soft); font-variant-numeric: oldstyle-nums; }
.life dt { font-family: var(--caps); font-size: 14px; letter-spacing: .1em; color: var(--muted); padding-top: 1px; }
.record { display: grid; gap: 12px; }
.strip { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 8px; }
.strip .yr { align-self: flex-end; font-family: var(--caps); font-size: 13px; letter-spacing: .1em; color: var(--muted);
  font-variant-numeric: oldstyle-nums; padding: 0 2px 2px 10px; }
.strip .keep { display: inline-flex; align-items: flex-end; gap: 8px; }
.strip .keep:first-child .yr { padding-left: 0; }
.strip button { display: block; border: 1px solid transparent; transition: border-color .4s ease; }
.strip button:disabled { cursor: default; }
.strip img, .strip .ph { display: block; opacity: .72; transition: opacity .4s ease; }
.strip button:not(:disabled):hover img, .strip button.on img { opacity: 1; }
.strip button.on { border-color: var(--muted); }
.strip.landing button { visibility: hidden; }
.flyers { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.flyer { position: absolute; display: block; transform-origin: 0 0; will-change: transform; opacity: .72; }
.text { min-width: 0; max-width: 40rem; padding-bottom: 30vh; }
.text h2 { font-family: var(--caps); font-size: 14px; font-weight: 400; letter-spacing: .14em; color: var(--muted); margin: 52px 0 16px; }
.text p { font-size: 19.5px; line-height: 1.78; color: var(--soft); }
.text p + p { margin-top: 1em; }
.text .placeholder { font-style: italic; color: var(--muted); margin-top: 52px; }
.claim { cursor: pointer; border-radius: 2px; text-decoration: underline dotted var(--faint); text-decoration-thickness: 1px; text-underline-offset: 5px;
  transition: color .35s ease, background-color .35s ease; }
.claim:hover { color: var(--ink); }
.claim.active { color: var(--ink); background-color: rgba(236, 235, 230, .055); text-decoration: underline solid var(--muted); text-decoration-thickness: 1px; }
.margin { position: sticky; top: 84px; align-self: start; max-height: calc(100vh - 104px); overflow-y: auto; padding: 52px 6px 16px 0;
  display: grid; gap: 18px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; transition: opacity .25s ease; }
.margin.fading { opacity: 0; }
.m-title { font-size: 20px; font-weight: 300; line-height: 1.35; color: var(--ink); }
.m-page { display: grid; gap: 10px; }
.m-src { font-family: var(--caps); font-size: 13.5px; letter-spacing: .1em; color: var(--muted); }
.m-src b { font-weight: 400; color: var(--soft); }
.m-page img { display: block; width: min(100%, calc(var(--nw, 9999) * 1.35px)); height: auto; opacity: .88; border: 1px solid var(--faint); cursor: zoom-in; transition: opacity .3s ease, border-color .3s ease; }
.m-page img:hover { opacity: 1; }
.m-page.focus img { border-color: var(--soft); }
.m-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.m-actions a, .m-actions button { color: var(--soft); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.m-quote { font-size: 15px; line-height: 1.6; color: var(--soft); border-left: 1px solid var(--muted); padding-left: 12px; }
.m-quote[hidden] { display: none; }
.m-quote small { display: block; margin-top: 6px; font-size: 13px; font-style: italic; color: var(--muted); }
.m-none, .m-intro { font-size: 15.5px; line-height: 1.6; font-style: italic; color: var(--muted); }
.m-cov { font-size: 14px; line-height: 1.55; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 12px; }
.m-cov b { font-family: var(--caps); font-weight: 400; letter-spacing: .08em; color: var(--soft); }
.ph-stack { display: flex; flex-wrap: wrap; gap: 10px; }
.ph { position: relative; display: block; }
.bio-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px 24px; flex-wrap: wrap;
  padding-top: 18px; border-top: 1px solid var(--rule); font-family: var(--caps); font-size: 14px; letter-spacing: .12em; color: var(--muted); }
.bio-foot .people { display: flex; gap: 8px 24px; flex-wrap: wrap; }
.bio-foot a { color: var(--soft); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }

/* a clipping at full size */
.zoom { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 56px 16px; background: rgba(5, 5, 5, .95); cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom img { max-width: min(100%, 1100px); max-height: 100%; border: 1px solid var(--faint); }

@media (max-width: 900px) {
  .bar.bottom .hint { display: none; }
  .bio-inner { grid-template-columns: minmax(0, 1fr); padding-bottom: 46vh; }
  .margin { position: fixed; left: 0; right: 0; top: auto; bottom: 0; z-index: 4; max-height: 40vh; padding: 14px 16px 18px;
    background: var(--bg); border-top: 1px solid var(--rule); }
  .text { padding-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .room, .bio, .clip, .clip img, .caption, .name3d .inner, .margin { transition: none !important; }
}
</style>

<body>
<div class="room" id="room">
  <div class="space" id="space"><div class="world" id="world"></div></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="edges" aria-hidden="true"></div>
  <header class="bar top"><a class="title" href="/" style="pointer-events:auto;text-decoration:none">Lorenz Hufe</a><span>Biographies from the newspaper record</span></header>
  <button class="down" id="down" type="button">Biography</button>
  <nav class="ticks" id="ticks" aria-label="People"></nav>
  <footer class="bar bottom"><span class="hint">Click a clipping to zoom in · ↓ the biography · drag to look around</span></footer>

</div>

<section class="bio" id="bio" tabindex="-1" aria-label="Biography">
  <div class="bio-bar">
    <button type="button" id="up">↑ The room</button>
    <span class="people"><button type="button" id="prevTop"></button><button type="button" id="nextTop"></button></span>
  </div>
  <div class="bio-inner">
    <header class="bio-head">
      <div>
        <p class="label">Biography</p>
        <h1 id="bName"></h1>
        <p class="full" id="bFull"></p>
      </div>
      <dl class="life" id="bLife"></dl>
      <div class="record">
        <p class="label" id="bRecord"></p>
        <div class="strip" id="bStrip"></div>
      </div>
    </header>
    <article class="text" id="bText"></article>
    <aside class="margin" id="bMargin" aria-live="polite"></aside>
    <footer class="bio-foot">
      <span class="people"><button type="button" id="prevFoot"></button><button type="button" id="nextFoot"></button></span>
      <span id="bFootNote"></span>
    </footer>
  </div>
</section>

<div class="flyers" id="flyers" aria-hidden="true"></div>
<div class="zoom" id="zoom" hidden><img id="zoomImg" alt=""></div>

<script>
const fmt = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mod = (a, n) => ((a % n) + n) % n;
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STATUS = { novel: "Not in reference works", partly: "Partly known", special: "Specialist literature only",
                 known: "Widely known", base: "From the baseline biography" };

// ---------- the biography shown on this page ----------
const yearsOf = p => (p.born.match(/\d{4}/) || ["18xx"])[0] + "–" + (p.died.match(/\d{4}/) || ["19xx"])[0];
const PAGES = window.DATA.pages;
const PEOPLE = window.DATA.people.map(p => ({ ...p, mock: false }));
const CLIPS = window.DATA.clippings.map(c => ({ ...c, mock: false }));
const realAspects = CLIPS.map(c => c.w / c.h);
CLIPS.forEach(c => { c.k = rnd(); });          // fixed mixed order within each person's wall
const collator = new Intl.Collator("de", { sensitivity: "base" });
PEOPLE.sort((a, b) => collator.compare(a.last, b.last) || collator.compare(a.first, b.first));
const N = PEOPLE.length, byId = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
const RING = N >= 6, SECTOR = RING ? 360 / N : 60;     // degrees of wall per person
const real = PEOPLE.filter(p => !p.mock).length;
const nameOf = p => `${p.first} ${p.last}`;

// ---------- the room: layout ----------
const space = $("space"), world = $("world"), caption = $("caption");
const GAP = 26, FLOAT = 80;
let S = 1, R = 1400, tiles = [], names = [], clusters = [], limPitch = 6;

function packRects(items, G) {   // as close to the centre as possible, wider than tall
  const placed = [];
  const free = (x, y, w, h) => !placed.some(r => x < r.x + r.w + G - .5 && x + w > r.x - G + .5 && y < r.y + r.h + G - .5 && y + h > r.y - G + .5);
  for (const it of items) {
    if (!placed.length) { it.x = -it.w / 2; it.y = -it.h / 2; placed.push(it); continue; }
    let best = null;
    for (const r of placed) {
      const ys = [r.y, r.y + r.h - it.h, r.y + (r.h - it.h) / 2], xs = [r.x, r.x + r.w - it.w, r.x + (r.w - it.w) / 2];
      const cands = [];
      ys.forEach(y => cands.push([r.x + r.w + G, y], [r.x - G - it.w, y]));
      xs.forEach(x => cands.push([x, r.y + r.h + G], [x, r.y - G - it.h]));
      for (const [x, y] of cands) {
        if (!free(x, y, it.w, it.h)) continue;
        const cost = Math.hypot((x + it.w / 2) / 2.2, y + it.h / 2);
        if (!best || cost < best.cost) best = { x, y, cost };
      }
    }
    it.x = best.x; it.y = best.y; placed.push(it);
  }
  return items;
}
// one person's wall: an empty space for the name in the middle, the clippings packed around it, shrunk until it fits its section
function personWall(p, slotSize, maxW, maxH) {
  const mine = CLIPS.map((c, i) => [c, i]).filter(([c]) => c.person === p.id).sort((a, b) => a[0].k - b[0].k);
  let pageW = 720 * S, out;
  for (let pass = 0; pass < 8; pass++) {
    const slot = { slot: true, w: slotSize.w, h: slotSize.h };
    const items = [slot, ...mine.map(([c, i]) => { const w = c.frac * pageW; return { i, w, h: w * c.h / c.w }; })];
    packRects(items, GAP * S * Math.max(.6, pageW / (720 * S)));
    const x0 = Math.min(...items.map(r => r.x)), y0 = Math.min(...items.map(r => r.y));
    const x1 = Math.max(...items.map(r => r.x + r.w)), y1 = Math.max(...items.map(r => r.y + r.h));
    out = { items: items.slice(1), slot, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
    const f = Math.min(maxW / out.w, maxH / out.h);
    if (f >= .98) break;
    pageW *= Math.max(.5, f * .97);
  }
  return out;
}

const toA = x => -(x / R) * 180 / Math.PI, toB = y => (y / R) * 180 / Math.PI;
const sectorYaw = k => -k * SECTOR;          // person k hangs at this angle; the view faces them at yaw = k * SECTOR
function build() {
  S = Math.max(.5, Math.min(1.1, Math.min(innerWidth / 1440, innerHeight / 860)));
  R = 1400 * S;
  space.style.setProperty("--persp", R + "px");
  world.innerHTML = ""; tiles = []; names = []; clusters = [];
  const maxW = .9 * R * SECTOR * Math.PI / 180, maxH = Math.max(260, innerHeight - 260);
  let maxHalfB = 0;
  PEOPLE.forEach((p, k) => {
    const cl = document.createElement("div"); cl.className = "cluster"; world.appendChild(cl); clusters[k] = cl;
    const nm = document.createElement("div");
    nm.className = "name3d"; nm.setAttribute("aria-hidden", "true");
    nm.style.setProperty("--fs", Math.round(62 * S) + "px");
    nm.innerHTML = `<div class="inner"><span class="nm">${esc(nameOf(p))}</span><span class="yr">${yearsOf(p)}</span></div>`;
    cl.appendChild(nm); names[k] = nm;
    const inner = nm.firstElementChild, grow = R / (R - FLOAT * S);
    const slotSize = { w: inner.offsetWidth * grow * 1.18 + 2 * GAP * S, h: inner.offsetHeight * grow * 1.18 + 2 * GAP * S };
    const wall = personWall(p, slotSize, maxW, maxH);
    maxHalfB = Math.max(maxHalfB, toB(wall.h / 2));
