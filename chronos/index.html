<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#002147">
<title>Download Chronos — The AI Historian</title>
<meta name="description" content="Download the Chronos desktop app for macOS, Windows and Linux. An AI co-historian for primary sources, by The AI Historian, University of Oxford.">
<link rel="icon" href="https://ai-historian.com/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --blue: #002147; --blue-mid: #337ab7; --dark: #2C2C2C; --muted: #6C6C6C; --border: #ecece6;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  html { overflow-y: scroll; }
  body { background: #fff; color: var(--dark); font-family: var(--mono); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--blue-mid); outline-offset: 3px; }

  .page { min-height: 100vh; min-height: 100svh; padding: 3rem 4rem; display: flex; flex-direction: column; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
  .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; }
  .brand-logo { height: 3.4rem; width: auto; display: block; }
  .brand-name { font-size: 1.3rem; font-weight: 600; color: var(--blue); letter-spacing: 0.01em; white-space: nowrap; }
  .nav { display: flex; gap: 2rem; align-items: center; }
  .nav a { font-size: 1rem; font-weight: 500; color: var(--muted); text-decoration: none; letter-spacing: 0.05em; padding-bottom: 0.25rem; border-bottom: 1.5px solid transparent; transition: color 0.15s, border-color 0.15s; }
  .nav a:hover { color: var(--blue); }
  .nav a.active { color: var(--blue); border-bottom-color: var(--blue); }
  .rule { border: none; border-top: 1px solid var(--border); }

  .hero { display: flex; align-items: center; justify-content: center; text-align: center; padding: 4rem 2rem 2.5rem; }
  .hero-inner { max-width: 55rem; }
  .hero-title { font-size: clamp(2rem, 3.5vw, 3.2rem); font-weight: 500; color: var(--blue); line-height: 1.4; margin-bottom: 1.2rem; }
  .sub { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.04em; }
  .sub a { color: var(--blue-mid); text-decoration: none; }
  .sub a:hover { color: var(--blue); }

  /* main download */
  .pick { display: flex; justify-content: center; padding: 0 0 2.5rem; }
  .pick-card { width: 100%; max-width: 36rem; border: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
  .pick-for { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
  .btn { display: inline-block; padding: 0.8rem 1.6rem; font: 500 0.95rem var(--mono); letter-spacing: 0.03em; text-decoration: none; color: #fff; background: var(--blue); border: 1px solid var(--blue); transition: background 0.15s, border-color 0.15s; }
  .btn:hover { background: var(--blue-mid); border-color: var(--blue-mid); }
  .btn.alt { background: transparent; color: var(--blue); }
  .btn.alt:hover { color: #fff; }
  .meta { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.02em; }
  .note { font-size: 0.85rem; color: var(--dark); line-height: 1.7; max-width: 32rem; }
  .note code { font-size: 0.85em; color: var(--blue); }
  .note b { font-weight: 600; }
  .note ol { text-align: left; margin: 0.5rem 0 0 1.25rem; padding: 0; }
  .note li { margin: 0.2rem 0; }
  .hidden { display: none; }

  /* all installers */
  .all-head { text-align: center; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.25rem; }
  .previews { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; max-width: 72rem; margin: 0 auto; width: 100%; padding: 0 0 2.5rem; }
  .preview-card { flex: 1 1 12rem; max-width: 16rem; border: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; text-decoration: none; color: inherit; transition: border-color 0.2s; }
  .preview-card:hover { border-color: var(--blue-mid); }
  .preview-title { font-size: 1rem; font-weight: 600; color: var(--blue); line-height: 1.4; }
  .preview-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.7; word-break: break-all; }

  .cta { text-align: center; padding: 1.5rem 0; margin-top: auto; }
  .cta-text { font-size: 0.95rem; color: var(--dark); margin-bottom: 0.4rem; }
  .cta a { font-size: 0.95rem; color: var(--blue-mid); text-decoration: none; }
  .cta a:hover { color: var(--blue); }
  .foot { display: flex; justify-content: center; gap: 2rem; padding-top: 1.25rem; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.03em; }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot a:hover { color: var(--blue); }

  @media (max-width: 1080px) { .page { padding: 2.5rem 2.5rem; } .nav { gap: 1.3rem; } .nav a { font-size: 0.9rem; } }
  @media (max-width: 800px)  { .page { padding: 2rem 1.5rem; } .hero { padding: 2.5rem 1rem 2rem; } }
  @media (max-width: 640px)  { .top-bar { flex-wrap: wrap; gap: 0.75rem 1rem; } .nav { width: 100%; gap: 1.25rem; } .nav a { font-size: 0.85rem; } }
  @media (max-width: 500px)  { .page { padding: 1.5rem 1rem; } .brand-logo { height: 2.4rem; } .brand-name { font-size: 1rem; } .hero-title { font-size: 1.6rem; } .pick-card, .preview-card { padding: 1.25rem; } }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <a class="brand" href="https://ai-historian.com/">
      <img src="https://ai-historian.com/logo-coin-128.png" alt="" class="brand-logo" width="128" height="128">
      <span class="brand-name">The AI Historian</span>
    </a>
    <nav class="nav">
      <a href="https://ai-historian.com/research/chronos">Chronos</a>
      <a class="active" href="./">Download</a>
      <a href="https://github.com/ai-historian/chronos-desktop">GitHub</a>
    </nav>
  </div>
  <hr class="rule">

  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">Download Chronos</h1>
      <p class="sub" id="sub">The AI Co-Historian · Agentic information extraction from primary sources</p>
    </div>
  </section>

  <section class="pick">
    <div class="pick-card" id="primary">
      <div class="pick-for" id="for">Finding the right download…</div>
      <div class="buttons" id="buttons"><a class="btn" id="dl" href="https://github.com/ai-historian/chronos-desktop/releases/latest">All releases on GitHub</a></div>
      <div class="meta" id="meta"></div>
      <div class="note hidden" id="note"></div>
    </div>
  </section>

  <section id="all-section" class="hidden">
    <div class="all-head">All installers</div>
    <div class="previews" id="all"></div>
  </section>

  <div class="cta">
    <a href="https://ai-historian.com/research/chronos">Read about Chronos</a>
  </div>
  <hr class="rule">
  <div class="foot">
    <a href="https://ai-historian.com/">ai-historian.com</a>
    <a href="https://github.com/ai-historian/chronos-desktop">Source on GitHub</a>
    <a href="https://github.com/ai-historian/chronos-desktop/releases">All releases</a>
  </div>
</div>

<script>
(async () => {
  const REPO = "ai-historian/chronos-desktop";
  const RELEASES = `https://github.com/${REPO}/releases/latest`;

  // One entry per installer; `match` recognises the release asset by its file name.
  const TARGETS = {
    "mac-arm64": { label: "macOS (Apple silicon)", match: /-arm64\.dmg$/i },
    "mac-x64":   { label: "macOS (Intel)",         match: /-x64\.dmg$/i },
    "win":       { label: "Windows (64-bit)",      match: /\.exe$/i },
    "linux-deb": { label: "Linux (Debian / Ubuntu .deb)", match: /\.deb$/i },
    "linux-appimage": { label: "Linux (AppImage, other distributions)", match: /\.AppImage$/i },
  };
  const NOTES = {
    mac: "<b>First launch takes one extra step</b>, because the app is not yet signed by Apple.<ol><li>Open the .dmg and drag Chronos into Applications.</li><li>Open Chronos once. macOS will refuse.</li><li>Open <b>System Settings › Privacy &amp; Security</b>, scroll down to the Security section and click <b>Open Anyway</b> next to Chronos.</li><li>Open Chronos again. You only need to do this once.</li></ol>",
    win: "Windows SmartScreen may warn on first launch, because the installer is not yet signed: click <b>More info</b>, then <b>Run anyway</b>.",
    linux: "Install with <code>sudo apt install ./chronos_*.deb</code>. Not on Debian or Ubuntu? Use the AppImage from the list below (needs <code>libfuse2</code>).",
  };

  async function detect() {
    const uad = navigator.userAgentData;
    const ua = navigator.userAgent;
    let os = uad?.platform || "";
    if (!os) os = /Windows/i.test(ua) ? "Windows" : /Mac/i.test(ua) ? "macOS" : /Linux|X11/i.test(ua) ? "Linux" : "";
    if (/Windows/i.test(os)) return { os: "win", primary: ["win"] };
    if (/Linux/i.test(os)) return { os: "linux", primary: ["linux-deb"] };
    if (/mac/i.test(os)) {
      let arch = null;
      try { arch = (await uad?.getHighEntropyValues(["architecture"]))?.architecture ?? null; } catch {}
      if (!arch) {                           // Safari: infer from the GPU name
        try {
          const gl = document.createElement("canvas").getContext("webgl");
          const ext = gl?.getExtension("WEBGL_debug_renderer_info");
          const r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "";
          if (/Apple (M\d|GPU)/i.test(r)) arch = "arm"; else if (/Intel|AMD|Radeon/i.test(r)) arch = "x86";
        } catch {}
      }
      if (arch === "arm") return { os: "mac", primary: ["mac-arm64", "mac-x64"] };
      if (arch === "x86") return { os: "mac", primary: ["mac-x64", "mac-arm64"] };
      return { os: "mac", primary: ["mac-arm64", "mac-x64"], unsure: true };
    }
    return { os: null, primary: [] };
  }

  async function latest() {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(`GitHub API ${r.status}`);
    const rel = await r.json();
    const assets = {};
    for (const [key, t] of Object.entries(TARGETS)) {
      const a = rel.assets.find(a => t.match.test(a.name));
      if (a) assets[key] = { url: a.browser_download_url, size: a.size, name: a.name };
    }
    return { version: rel.tag_name, date: rel.published_at?.slice(0, 10), assets };
  }

  const mb = n => `${(n / 1048576).toFixed(0)} MB`;
  const $ = id => document.getElementById(id);

  const [d, rel] = await Promise.all([detect(), latest().catch(() => null)]);

  if (!rel) {
    $("for").textContent = d.os ? `For ${TARGETS[d.primary[0]].label}` : "Downloads";
    $("meta").innerHTML = `Could not read the latest release from GitHub. <a href="${RELEASES}">Pick your installer on the releases page.</a>`;
    return;
  }

  $("sub").innerHTML = `The AI Co-Historian · <a href="https://github.com/${REPO}/releases/tag/${rel.version}">${rel.version}</a>${rel.date ? " · " + rel.date : ""}`;

  const all = $("all");
  for (const [key, t] of Object.entries(TARGETS)) {
    const a = rel.assets[key]; if (!a) continue;
    const card = document.createElement("a");
    card.className = "preview-card"; card.href = a.url;
    card.innerHTML = `<div class="preview-title">${t.label}</div><div class="preview-desc">${mb(a.size)} · ${a.name}</div>`;
    all.appendChild(card);
  }
  $("all-section").classList.remove("hidden");

  const first = d.primary.find(k => rel.assets[k]);
  if (!first) {
    $("for").textContent = "Pick your platform";
    $("dl").textContent = `Chronos ${rel.version} on GitHub`;
    $("dl").href = RELEASES;
    return;
  }

  const a = rel.assets[first];
  $("for").textContent = d.unsure ? "For macOS" : `For ${TARGETS[first].label}`;
  $("dl").textContent = d.unsure ? `Download for Apple silicon` : `Download Chronos ${rel.version}`;
  $("dl").href = a.url;
  const second = d.primary.slice(1).find(k => rel.assets[k]);
  if (second) {
    const alt = document.createElement("a");
    alt.className = "btn alt"; alt.href = rel.assets[second].url;
    alt.textContent = d.unsure ? "Intel Mac" : TARGETS[second].label.replace(/^.*\(|,.*$|\)$/g, "");
    $("buttons").appendChild(alt);
  }
  $("meta").textContent = `${mb(a.size)} · ${a.name}`;
  if (d.unsure) $("meta").textContent += " · Not sure? Apple menu › About This Mac shows the chip.";
  const note = NOTES[d.os];
  if (note) { $("note").innerHTML = note; $("note").classList.remove("hidden"); }
})();
</script>
</body>
</html>
